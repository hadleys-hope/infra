name: infra-ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Shell syntax and deployment retry behavior
        run: |
          bash -n rst
          python3 -m unittest discover -s tests -v
      - name: Compose configuration
        env:
          ADMIN_TOKEN: ci-validation-only
          DOMAIN: example.invalid
        run: docker compose -f compose.yaml config --quiet
